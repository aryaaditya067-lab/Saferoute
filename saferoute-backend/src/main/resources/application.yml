server:
  port: ${PORT:8080}

spring:
  application:
    name: saferoute-backend
  datasource:
    # File database inside ./data. Nothing to install.
    url: jdbc:h2:file:./data/saferoute;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  sql:
    init:
      mode: always

saferoute:
  cors:
    allowed-origins: ${SAFEROUTE_ALLOWED_ORIGINS:http://localhost:3000}

  # The city whose crime reports are collected. The bounding box only limits
  # where news localities may be geocoded; it is configuration, not crime data.
  city:
    name: Bengaluru
    aliases: [Bengaluru, Bangalore]
    country: India
    region: Karnataka
    bbox:
      south: 12.73
      west: 77.37
      north: 13.23
      east: 77.88

  providers:
    router-url: ${SAFEROUTE_ROUTER_URL:https://routing.openstreetmap.de}
    geocoder-url: ${SAFEROUTE_GEOCODER_URL:https://photon.komoot.io}
    # Tried in order; the public servers are often busy, so mirrors follow the main one.
    overpass-url: ${SAFEROUTE_OVERPASS_URL:https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter,https://overpass.private.coffee/api/interpreter}
    user-agent: "SafeRoute/0.1 (student project; contact: ${SAFEROUTE_CONTACT_EMAIL:not-set})"

  mimo:
    base-url: ${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}
    api-key: ${MIMO_API_KEY:}
    model: ${MIMO_MODEL:mimo-v2.6-flash}
    max-keywords: 3
    # Search results per keyword. MiMo's default is small; raise it for more coverage.
    search-limit: ${MIMO_SEARCH_LIMIT:5}

  ingest:
    enabled: ${SAFEROUTE_INGEST_ENABLED:true}
    # How often to look for new reports (ISO-8601 duration).
    interval: ${SAFEROUTE_INGEST_INTERVAL:PT3H}
    initial-delay: PT30S
    # Search asks for news from the last N days; reports dated within
    # safety.incident-window-days are accepted.
    lookback-days: 7
    max-articles-per-run: ${SAFEROUTE_MAX_ARTICLES:40}
    # GDELT (free news index) adds many more Bengaluru crime articles to read.
    gdelt-enabled: ${SAFEROUTE_GDELT_ENABLED:true}
    gdelt-url: https://api.gdeltproject.org/api/v2/doc/doc
    # false = fast keyword rules + OpenStreetMap locality names (no AI, no cost).
    # true  = MiMo web search + MiMo reads each article (needs MIMO_API_KEY).
    use-mimo: ${SAFEROUTE_USE_MIMO:false}

  safety:
    # Reports older than this are ignored for the map and for routing.
    incident-window-days: 365
    # A report counts half as much after this many days.
    recency-half-life-days: 120
    # Minimum radius around a reported locality that counts as "the area".
    min-incident-radius-meters: 250
    max-incident-radius-meters: 1500
    # A route sample is "covered" when a police station / hospital is this close.
    service-radius-meters: 1000
    # Candidates slower than fastest x this factor are dropped.
    max-detour-factor: 1.8
    # Relative importance of each factor when ranking routes (tune freely).
    weights:
      crime: 0.32
      community: 0.14
      night-light: 0.10
      darkness: 0.08
      main-roads: 0.10
      activity: 0.08
      police: 0.10
      hospital: 0.08
    # Relative weight of each crime category inside the crime factor.
    category-weights:
      violent: 1.0
      property: 0.5

  # NASA Black Marble night lights, generated by tools/nightlights.py (optional).
  night-lights:
    file: ${SAFEROUTE_NIGHT_LIGHTS_FILE:./data/nightlights.csv}

  # Walking extras: "open now" uses the city's local time. Metro hours come from
  # OpenStreetMap; operator-hours (OSM opening_hours syntax, e.g. "Mo-Su 05:00-23:00")
  # is used only for stations without hours, and only if operator-hours-source names
  # where you copied it from (e.g. the BMRCL website). Leave both empty otherwise.
  transit:
    time-zone: Asia/Kolkata
    operator-hours: ${SAFEROUTE_METRO_HOURS:}
    operator-hours-source: ${SAFEROUTE_METRO_HOURS_SOURCE:}
    max-station-distance-meters: 1200

  # One-time history load: POST /api/v1/admin/backfill (see README).
  backfill:
    months: 12
    # GDELT is queried in windows of this many days (max 250 articles each).
    window-days: 15
    # When a headline names no locality, download the article and look in its text.
    fetch-articles: ${SAFEROUTE_BACKFILL_FETCH:true}

  # Reports from app users (poorly lit spots, harassment, potholes, ...).
  community:
    expiry-days: 60
    # Different people needed before a spot affects routing.
    confirm-threshold: 3
    cluster-radius-meters: 150
    max-per-device-per-day: 5
    max-per-ip-per-day: 20

  admin:
    # Required in the X-Admin-Token header to trigger an ingest manually.
    token: ${SAFEROUTE_ADMIN_TOKEN:}
